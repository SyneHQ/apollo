[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syne-connectors"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
description = "Bounded business-source workers for the Syne Go bridge"
dependencies = ["dlt==1.30.0", "jsonschema==4.26.0", "requests==2.34.2", "simplejson==4.1.2"]

[tool.setuptools.packages.find]
include = ["syne_connectors*"]

[tool.setuptools.package-data]
syne_connectors = ["manifest-v1.schema.json"]
